name: Descargar videotutorias

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Lista de grabaciones (la envía el snippet del campus)"
        required: true

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -s https://rclone.org/install.sh | sudo bash
          pip install -U yt-dlp

      - name: Configurar Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Descargar grabaciones nuevas
        env:
          VIDEOS: ${{ inputs.videos }}
          ZOOM_PASS: ${{ secrets.ZOOM_PASS }}
        run: python descargar.py
